name: Publish sourced radar

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check API keys
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          if [ -z "$TAVILY_API_KEY" ] || [ -z "$NEBIUS_API_KEY" ]; then
            echo "::error::Add TAVILY_API_KEY and NEBIUS_API_KEY in repository Actions secrets."
            exit 1
          fi
      - name: Scan public sources
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: node backend/server.mjs scan
      - name: Publish validated results
        run: node backend/publish.mjs
      - name: Commit only radar data
        run: |
          if git diff --quiet -- public/data/opportunities.json; then
            echo "Radar data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities.json
          git commit -m "Update sourced radar data"
          git push
